<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusOS Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-row">
        <div class="logo-badge">⚡</div>
        <div>
          <h1 class="title">FocusOS</h1>
          <p class="subtitle">Intelligent Shield & Sync</p>
        </div>
      </div>
      <span id="status-badge" class="badge badge-online">Connected</span>
    </header>

    <div class="session-card">
      <div class="card-label">CURRENT FOCUS SESSION</div>
      <div id="session-title" class="session-title">Deep Work Sprint</div>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="button-row">
        <button id="btn-toggle-session" class="btn btn-primary">Start Focus</button>
        <button id="btn-open-app" class="btn btn-secondary">Open Studio</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num" id="stat-attention">78%</div>
        <div class="stat-label">Attention</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-shorts">32m</div>
        <div class="stat-label">Shorts</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-focus">1h 45m</div>
        <div class="stat-label">Focus</div>
      </div>
    </div>

    <div class="section-title">ACTIVE WEBSITE BLOCKS</div>
    <ul id="block-list" class="block-list">
      <li class="block-item"><span class="dot"></span> youtube.com (Shorts)</li>
      <li class="block-item"><span class="dot"></span> instagram.com</li>
      <li class="block-item"><span class="dot"></span> twitter.com</li>
    </ul>

    <div class="override-section">
      <button id="btn-override" class="btn btn-override">Request 15m Intentional Bypass</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
